[project]
name = "rubrik-sdk"
version = "0.2.0"
description = "A small, read-only-by-default SDK for Rubrik Security Cloud's (RSC) GraphQL API, built on sdk-primer-core."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Billings", email = "blueneptune@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "sdk-primer",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
]

[project.scripts]
rubrik-probe = "rubrik_sdk.tools.probe:main"
rubrik-sample = "rubrik_sdk.tools.sample:main"
rubrik-mask = "rubrik_sdk.tools.mask:main"

[project.urls]
Homepage = "https://github.com/blueneptune/yoki-py-rubrik-sdk"
Repository = "https://github.com/blueneptune/yoki-py-rubrik-sdk"

[tool.uv.sources]
# The transport underneath: retries, typed exceptions, request logging,
# the service-account token exchange.
sdk-primer = { git = "https://github.com/blueneptune/sdk-primer-core.git", tag = "v0.1.2" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# With no git commits yet, hatchling can't fall back to `git ls-files` to
# figure out what belongs in the sdist, so it includes everything under the
# repo root by default - explicitly excluding IDE/tooling state keeps
# machine-specific junk (e.g. .idea/workspace.xml) out of published
# artifacts regardless of git history.
exclude = [".idea", ".venv", ".mypy_cache", ".ruff_cache", ".pytest_cache", "*.iml"]

[tool.hatch.metadata]
# sdk-primer is a git dependency, not a PyPI one.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/rubrik_sdk"]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
addopts = "--cov=rubrik_sdk --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/rubrik_sdk"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
